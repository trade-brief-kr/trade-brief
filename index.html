<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>글로벌 통상 브리프</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/stats.css"></head>
<body>
<header class="site-header"><div class="container"><div class="heading"><div><p class="eyebrow">DAILY TRADE & POLICY</p><h1>글로벌 통상 브리프</h1></div><div class="dates"><strong id="report-date">보고서 불러오는 중</strong><p id="updated"></p></div></div>
<div class="controls"><label>소관과 <select id="department"><option value="">전체(기본 순서)</option></select></label><label>국가 <select id="country" disabled><option value="">전체</option></select></label><button id="reset" type="button">초기화</button><button id="copy" type="button" disabled>텍스트 복사</button></div>
<div class="archive-bar"><div class="day-nav"><button id="prev-day" type="button" disabled aria-label="이전 날짜 보고서">◀ 이전</button><label class="sr-only" for="archive-date">보고서 날짜</label><select id="archive-date" disabled><option value="">최신 보고서</option></select><button id="next-day" type="button" disabled aria-label="다음 날짜 보고서">다음 ▶</button></div><form id="search-form" role="search"><input id="search" type="search" placeholder="지난 보고서 키워드 검색" aria-label="지난 보고서 키워드 검색"><button type="submit">검색</button></form></div>
<nav role="tablist" aria-label="콘텐츠"><button id="brief-tab" role="tab" aria-selected="true" aria-controls="brief">일일 브리프</button><button id="country-tab" role="tab" aria-selected="false" aria-controls="country-info" tabindex="-1">국가 정보</button></nav></div></header>
<main class="container"><div id="archive-banner" class="archive-banner" hidden><span id="archive-banner-text"></span><button id="to-latest" type="button">최신 보고서로</button></div><section id="search-results" class="card search-results" hidden></section><section id="brief" role="tabpanel" aria-labelledby="brief-tab"><p class="muted" role="status">보고서를 불러오고 있습니다.</p></section><section id="country-info" role="tabpanel" aria-labelledby="country-tab" hidden><p class="muted" role="status">국가 정보를 불러오고 있습니다.</p></section><p id="status" role="status" aria-live="polite"></p></main>
<script src="data/report.js"></script><script src="data/archive/index.js"></script><script src="assets/app.js"></script><script src="data/country-stats.js"></script><script src="assets/stats.js"></script>
</body></html>
